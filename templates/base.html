{% load static %}
<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}Desarrollador Fullstack Python — CV y Portafolio Profesional.{% endblock %}">
    <meta property="og:title" content="{% block og_title %}Roberto Otárola | CV Web{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Explora mi trayectoria profesional y portafolio de proyectos.{% endblock %}">
    <meta property="og:type" content="website">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}">
    
    <title>{% block title %}Roberto Otárola | CV{% endblock %}</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="{% block meta_description %}Curriculum Vitae dinámico de Roberto Otárola — Desarrollador Fullstack Python. Experiencia, habilidades técnicas, proyectos y educación.{% endblock %}">
    <meta name="author" content="Roberto Otárola">

    <!-- Open Graph -->
    <meta property="og:title" content="{% block og_title_og %}CV — Roberto Otárola{% endblock %}">
    <meta property="og:description" content="Desarrollador Fullstack Python — Portfolio profesional y CV dinámico.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://alke-web-cv.onrender.com">
    <meta property="og:image" content="{% static 'img/portfolio/alke_cv.png' %}">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">
    <!-- Google Font: Roboto Condensed -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
          rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top" id="mainNavbar">
    <div class="container">
        <a class="navbar-brand" href="{% url 'cv:index' %}">
            <span class="fw-bold">RO</span><span class="text-secondary">.dev</span>
        </a>

        <!-- Navbar Toggler for Mobile -->
        <button class="navbar-toggler" type="button" 
                data-bs-toggle="collapse" data-bs-target="#navbarNav" 
                aria-controls="navbarNav" aria-expanded="false" 
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center gap-1">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'cv:index' %}">
                        <i class="bi bi-house-door me-1"></i>Inicio
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'portfolio:index' %}">
                        <i class="bi bi-briefcase me-1"></i>Portfolio
                    </a>
                </li>
                {% if user.is_staff %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'admin:index' %}">
                        <i class="bi bi-gear me-1"></i>Admin
                    </a>
                </li>
                {% endif %}
                <li class="nav-item ms-lg-2">
                    <button class="theme-toggle" id="themeToggle"
                            data-bs-toggle="tooltip" data-bs-placement="bottom"
                            title="Cambiar tema">
                        <i class="bi bi-moon-stars-fill"></i>
                    </button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main Content -->
<main>
    {% block content %}{% endblock %}
</main>

<!-- Footer -->
<footer class="footer-custom mt-auto">
    <div class="container text-center">
        <div class="d-flex justify-content-center gap-3 mb-3">
            <a href="https://www.linkedin.com/in/robertootarola/" class="footer-social-icon"
               target="_blank" data-bs-toggle="tooltip" title="LinkedIn">
                <i class="bi bi-linkedin"></i>
            </a>
            <a href="https://github.com/RobertoOtarola" class="footer-social-icon"
               target="_blank" data-bs-toggle="tooltip" title="GitHub">
                <i class="bi bi-github"></i>
            </a>
        </div>
        <p class="mb-0">&copy; {% now "Y" %} Roberto Otárola. Todos los derechos reservados.</p>
    </div>
</footer>

<!-- Back to Top Button -->
<button class="back-to-top" aria-label="Volver arriba">
    <i class="bi bi-chevron-up"></i>
</button>

<!-- Bootstrap 5.3 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- jQuery 3.7 (slim) -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<!-- Custom JS -->
<script src="{% static 'js/main.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
